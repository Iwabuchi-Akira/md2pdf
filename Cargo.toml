[package]
name = "md2pdf"
version = "0.1.0"
edition = "2024"
description = "Japanese Markdown to PDF with the original md2pdf print design"
repository = "https://github.com/Iwabuchi-Akira/md2pdf"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
include_dir = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.23"
tungstenite = "0.30"
url = "2.5"

[profile.release]
lto = "thin"
strip = true
